<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f6fc" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cursa.theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var a = localStorage.getItem("cursa.accent");
          if (a !== "blue" && a !== "purple") a = "blue";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-accent", a);
        } catch (e) {}
      })();
    </script>
    <title>Cursa — Estudio asistido por IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Pantalla de arranque mínima mientras carga el JavaScript; React la reemplaza al montar. -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:'Figtree',system-ui,sans-serif;color:var(--color-text-secondary,#46456a);background:var(--color-bg,#f5f4fb)">
        <svg width="64" height="64" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#4f46e5"/><path d="M27.2 13.4A10.4 10.4 0 1 0 27.2 26.6" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><circle cx="29.2" cy="20" r="2.6" fill="#fff"/></svg>
        <p style="margin:0;font-size:15px">Preparando tu entorno de estudio…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
